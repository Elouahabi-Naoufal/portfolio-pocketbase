services:
  pocketbase:
    build: .
    image: portfolio-pocketbase:0.40.5
    container_name: pocketbase
    restart: unless-stopped
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL:-}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD:-}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pb_data:
